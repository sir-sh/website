# DEV-393 shared template: Next.js / npm repos (epic DEV-382).
# Pins verified by DevOps (see README.md): actions/checkout v6.1.0, actions/setup-node v6.5.0.
# Per repo: adjust branch names, node-version (or node-version-file), and remove steps the repo does not have.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts
      # Lint is not run here: the repository has existing lint errors in application code. Re-add the step after they are fixed.
      - name: Typecheck
        run: |
          if [ -f tsconfig.json ]; then npx --no-install tsc --noEmit; fi
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build --if-present
